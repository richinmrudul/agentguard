[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-evals"
version = "0.2.2"
description = "Local-first safety and reliability evaluation framework for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0,<2.0.0",
    "coverage[toml]>=7.6.0,<8.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff==0.15.14",
    "setuptools>=77",
]

[project.scripts]
agentguard = "agentguard.cli.main:app"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that require an available Docker daemon",
    "package: tests that build or install distribution artifacts",
]

[tool.coverage.run]
branch = true
source = ["agentguard"]
data_file = "coverage/.coverage"
relative_files = true

[tool.coverage.report]
fail_under = 88
precision = 2
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.html]
directory = "coverage/html"

[tool.ruff]
line-length = 88
target-version = "py39"
