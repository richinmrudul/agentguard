name: AgentGuard Showcase Metrics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard
        run: python -m pip install -e ".[dev]"

      - name: Run showcase metrics
        run: python scripts/showcase_metrics.py

      - name: Write showcase metrics summary
        run: |
          {
            echo "### AgentGuard showcase metrics"
            echo "- Metrics JSON: docs/results/showcase-metrics.json"
            echo "- Metrics Markdown: docs/results/showcase-metrics.md"
            echo "- Runtime reports: .agentguard/showcase"
            echo "- Fake secrets are configured test strings and are not rendered in generated metrics."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload showcase metrics and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-showcase-metrics
          path: |
            docs/results/showcase-summary.json
            docs/results/showcase-summary.md
            docs/results/showcase-metrics.json
            docs/results/showcase-metrics.md
            .agentguard/showcase/showcase-summary.json
            .agentguard/showcase/showcase-summary.md
            .agentguard/showcase/showcase-overhead.json
            .agentguard/showcase/showcase-overhead.md
            .agentguard/showcase/suites/*/suite.json
            .agentguard/showcase/suites/*/suite.md
            .agentguard/showcase/suites/*/manifest.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Verify retained showcase evidence
        if: always()
        shell: bash
        run: |
          missing=0
          require_file() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              echo "Missing required AgentGuard artifact: ${path}" >&2
              missing=1
            fi
          }
          require_any() {
            local label="$1"
            shift
            local matches=("$@")
            if (( ${#matches[@]} == 0 )); then
              echo "Missing required AgentGuard artifact: ${label}" >&2
              missing=1
            fi
          }
          shopt -s nullglob
          suite_json=(.agentguard/showcase/suites/*/suite.json)
          suite_markdown=(.agentguard/showcase/suites/*/suite.md)
          suite_manifests=(.agentguard/showcase/suites/*/manifest.json)
          require_file ".agentguard/showcase/showcase-summary.json"
          require_file ".agentguard/showcase/showcase-summary.md"
          require_file ".agentguard/showcase/showcase-overhead.json"
          require_file ".agentguard/showcase/showcase-overhead.md"
          require_any ".agentguard/showcase/suites/*/suite.json" "${suite_json[@]}"
          require_any ".agentguard/showcase/suites/*/suite.md" "${suite_markdown[@]}"
          require_any ".agentguard/showcase/suites/*/manifest.json" "${suite_manifests[@]}"
          exit "$missing"
