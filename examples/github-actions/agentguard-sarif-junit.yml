name: AgentGuard SARIF and JUnit Example

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # AgentGuard CI mode needs base/head history for diffs.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard
        run: python -m pip install -e .

      - name: Run AgentGuard
        run: |
          agentguard ci \
            --config agentguard.yaml \
            --base origin/main \
            --head HEAD \
            --allow-failures

      - name: Export SARIF and JUnit
        run: |
          agentguard reports export-sarif .agentguard/ci \
            --output agentguard.sarif \
            --force
          agentguard reports export-junit .agentguard/ci \
            --output agentguard-junit.xml \
            --suite-name "AgentGuard CI" \
            --force

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentguard.sarif
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Upload JUnit report artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentguard-junit.xml
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  upload-sarif:
    runs-on: ubuntu-latest
    needs: evaluate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      # Required only in this job, which does not check out or execute repository code.
      security-events: write
    steps:
      - name: Download AgentGuard SARIF
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: agentguard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentguard-exports

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentguard-exports/agentguard.sarif
