name: AgentGuard CI Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  agentguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # AgentGuard needs the base ref/history for --base/--head diffs.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard
        run: python -m pip install -e ".[dev]"

      # Replace agentguard.yaml with your repository's AgentGuard CI config.
      # This step fails the PR when AgentGuard scores the change as unsafe.
      - name: Run AgentGuard CI gate
        env:
          AGENTGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          agentguard ci \
            --config agentguard.yaml \
            --base "$AGENTGUARD_BASE_SHA" \
            --head HEAD \
            --github-summary

      - name: Upload AgentGuard reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-ci-reports
          path: |
            .agentguard/ci/**/*.json
            .agentguard/ci/**/*.md
            .agentguard/ci/**/command_log.json
            .agentguard/ci/**/manifest.json
          include-hidden-files: true
          if-no-files-found: error
