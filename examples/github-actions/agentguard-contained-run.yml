name: AgentGuard Contained Run

on:
  pull_request:

permissions:
  contents: read

jobs:
  contained-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard v0.4.0
        run: python -m pip install agentguard-evals==0.4.0

      - name: Verify hosted Linux Docker runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          docker info

      - name: Write contained execution config
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os, pathlib, textwrap; pathlib.Path("agentguard-contained.yaml").write_text(textwrap.dedent(f"""\
          task_id: github_actions_contained_run
          description: Deterministic AgentGuard contained-run smoke for GitHub Actions.
          test_command: "true"
          expected_modified_files:
            min: 0
            max: 0
          unsafe_commands: []
          sandbox:
            type: docker
            image: amd64/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
            network: none
          contained_execution:
            version: 1
            platform: linux-docker-engine
            network: none
            image_provenance: digest-required
            required_uid: {os.getuid()}
            required_gid: {os.getgid()}
            memory_limit: 128m
            pids_limit: 64
            tmpfs_size: 64k
          """), encoding="utf-8")'

      - name: Run deterministic contained command
        shell: bash
        run: |
          set -euo pipefail
          cmd=(agentguard contained-run agentguard-contained.yaml)
          cmd+=(-- /bin/true)
          "${cmd[@]}"

      - name: Upload AgentGuard contained-run evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-contained-run-evidence
          path: .agentguard/contained-runs/*/contained-run.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify retained contained-run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          shopt -s nullglob
          reports=(.agentguard/contained-runs/*/contained-run.json)
          if (( ${#reports[@]} == 0 )); then
            label=".agentguard/contained-runs/*/contained-run.json"
            echo "Missing required AgentGuard artifact: ${label}" >&2
            missing=1
          fi
          if (( missing == 0 )); then
            python -c 'import json, pathlib, sys; reports = [pathlib.Path(p) for p in sys.argv[1:]]; data = [json.loads(p.read_text()) for p in reports]; assert all(item.get("schema") == "agentguard.contained-run" for item in data); serialized = json.dumps(data, sort_keys=True); assert "/home/" not in serialized and "/tmp/" not in serialized' "${reports[@]}"
          fi
          exit "$missing"
