name: AgentGuard Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  agentguard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard
        run: python -m pip install -e ".[dev]"

      - name: Create current baseline
        run: agentguard suite examples/suites/core.yaml --allow-failures --save-baseline /tmp/agentguard-core-baseline.json

      - name: Gate suite against baseline
        run: agentguard gate suite examples/suites/core.yaml --baseline /tmp/agentguard-core-baseline.json --allow-failures

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-suite-gate
          path: |
            .agentguard/suites/*/suite.json
            .agentguard/suites/*/suite.md
            .agentguard/suites/*/manifest.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Verify retained gate reports
        if: always()
        shell: bash
        run: |
          missing=0
          require_any() {
            local label="$1"
            shift
            local matches=("$@")
            if (( ${#matches[@]} == 0 )); then
              echo "Missing required AgentGuard artifact: ${label}" >&2
              missing=1
            fi
          }
          shopt -s nullglob
          suite_json=(.agentguard/suites/*/suite.json)
          suite_markdown=(.agentguard/suites/*/suite.md)
          suite_manifests=(.agentguard/suites/*/manifest.json)
          require_any ".agentguard/suites/*/suite.json" "${suite_json[@]}"
          require_any ".agentguard/suites/*/suite.md" "${suite_markdown[@]}"
          require_any ".agentguard/suites/*/manifest.json" "${suite_manifests[@]}"
          exit "$missing"

      # This example writes the baseline to /tmp so it is copyable and
      # self-contained. In a real repository, store an approved baseline in a
      # tracked path such as baselines/agentguard-core.json or download it from
      # durable CI storage, then update it intentionally when benchmark changes
      # are reviewed and accepted.
