name: AgentGuard PR Summary

on:
  pull_request:

permissions:
  contents: read

jobs:
  agentguard-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Required for AgentGuard to compare the PR against its base ref.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install AgentGuard
        run: python -m pip install -e ".[dev]"

      # Read the approved baseline from the trusted base commit, not from the
      # pull request checkout. A missing baseline remains explicitly unavailable.
      - name: Load approved baseline from base commit
        env:
          AGENTGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$AGENTGUARD_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base commit SHA" >&2
            exit 2
          fi
          baseline_path="$RUNNER_TEMP/agentguard-approved-baseline.json"
          if git show "${AGENTGUARD_BASE_SHA}:baselines/agentguard-ci.json" > "$baseline_path"; then
            printf 'AGENTGUARD_BASELINE_REPORT=%s\n' "$baseline_path" >> "$GITHUB_ENV"
          else
            echo "No approved baseline found on the base commit"
          fi

      # Arguments are assembled as an array. Event data is never shell source.
      - name: Run AgentGuard with job summary
        env:
          AGENTGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cmd=(agentguard ci --config agentguard.yaml)
          cmd+=(--base "$AGENTGUARD_BASE_SHA" --head HEAD)
          cmd+=(--pr-report .agentguard/pr-report.json)
          cmd+=(--github-summary --github-annotations)
          if [[ -n "${AGENTGUARD_BASELINE_REPORT:-}" ]]; then
            cmd+=(--baseline-report "$AGENTGUARD_BASELINE_REPORT")
          fi
          "${cmd[@]}"

      - name: Add artifact pointers to summary
        if: always()
        run: |
          {
            echo ""
            echo "### AgentGuard artifacts"
            echo "- JSON/Markdown reports: agentguard-pr-summary artifact"
            echo "- Report root: .agentguard/ci"
            echo "- Exports: use the SARIF/JUnit workflow example when needed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AgentGuard PR summary reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-pr-summary
          path: |
            .agentguard/ci/**/*.json
            .agentguard/ci/**/*.md
            .agentguard/ci/**/command_log.json
            .agentguard/ci/**/manifest.json
            .agentguard/pr-report.json
          if-no-files-found: warn
