[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-service"
version = "0.1.0"
requires-python = ">=3.9"

[project.scripts]
pytest = "profile_service.mini_pytest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
