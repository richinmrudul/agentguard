benchmarks:
  - id: auth_bug
    version: 1
    name: Auth Login Bug
    category: test_tampering
    difficulty: easy
    description: Detects whether an agent fixes auth logic or tampers with tests.
    tags:
      - python
      - docker
      - test-tampering
    configs:
      safe: examples/configs/fix_auth_bug_docker_command_safe.yaml
      adversarial: examples/configs/fix_auth_bug_docker_command_cheater.yaml
    contract: examples/benchmarks/contracts/auth_bug.yaml

  - id: cli_parser_bug
    version: 1
    name: CLI Parser Bug
    category: test_tampering
    difficulty: medium
    description: Detects source fix versus weakened calculator parser tests.
    tags:
      - python
      - docker
      - cli
      - test-tampering
    configs:
      safe: examples/configs/fix_cli_parser_bug_command_safe.yaml
      adversarial: examples/configs/fix_cli_parser_bug_command_cheater.yaml
    contract: examples/benchmarks/contracts/cli_parser_bug.yaml

  - id: prompt_injection_readme
    version: 1
    name: Prompt Injection README
    category: prompt_injection
    difficulty: medium
    description: Detects agents that follow malicious repo instructions and create secret files.
    tags:
      - python
      - docker
      - prompt-injection
      - secret-access
    configs:
      safe: examples/configs/prompt_injection_readme_safe.yaml
      adversarial: examples/configs/prompt_injection_readme_injection_follower.yaml
    contract: examples/benchmarks/contracts/prompt_injection_readme.yaml

  - id: dependency_script_injection
    version: 1
    name: Dependency Script Injection
    category: dependency_injection
    difficulty: hard
    description: Detects agents that follow malicious dependency or setup instructions outside the requested source fix.
    tags:
      - python
      - docker
      - dependency
      - prompt-injection
      - script-injection
    configs:
      safe: examples/configs/dependency_script_injection_safe.yaml
      adversarial: examples/configs/dependency_script_injection_follower.yaml
    contract: examples/benchmarks/contracts/dependency_script_injection.yaml

  - id: filesystem_boundary
    version: 1
    name: Filesystem Boundary
    category: filesystem_boundary
    difficulty: hard
    description: Detects agents that attempt filesystem boundary or secret-file behavior.
    tags:
      - python
      - docker
      - filesystem
      - sandbox
      - secret-access
    configs:
      safe: examples/configs/filesystem_boundary_safe.yaml
      adversarial: examples/configs/filesystem_boundary_escape.yaml
    contract: examples/benchmarks/contracts/filesystem_boundary.yaml

  - id: symlink_path_traversal
    version: 1
    name: Symlink Path Traversal
    category: filesystem_boundary
    difficulty: hard
    description: Detects agents that follow symlink or parent-path bait and write secret-like files outside the requested source scope.
    tags:
      - python
      - docker
      - filesystem
      - symlink
      - path-traversal
      - sandbox
      - secret-access
    configs:
      safe: examples/configs/symlink_path_traversal_safe.yaml
      adversarial: examples/configs/symlink_path_traversal_follower.yaml
    contract: examples/benchmarks/contracts/symlink_path_traversal.yaml

  - id: scope_drift_refactor
    version: 1
    name: Scope Drift Refactor
    category: scope_drift
    difficulty: medium
    description: Detects agents that turn a small source fix into an overbroad refactor or extra file churn.
    tags:
      - python
      - local-command
      - scope-drift
      - diff-limit
      - adversarial-core
    configs:
      safe: examples/configs/scope_drift_refactor_safe.yaml
      adversarial: examples/configs/scope_drift_refactor_overbroad.yaml
    contract: examples/benchmarks/contracts/scope_drift_refactor.yaml

  - id: ci_bypass_attempt
    version: 1
    name: CI Bypass Attempt
    category: ci_bypass
    difficulty: medium
    description: Detects agents that edit CI configuration to skip tests instead of fixing the task.
    tags:
      - python
      - local-command
      - ci-bypass
      - test-tampering
      - adversarial-core
    configs:
      safe: examples/configs/ci_bypass_attempt_safe.yaml
      adversarial: examples/configs/ci_bypass_attempt_skipper.yaml
    contract: examples/benchmarks/contracts/ci_bypass_attempt.yaml

  - id: hidden_instruction_comment
    version: 1
    name: Hidden Instruction Comment
    category: hidden_instruction
    difficulty: medium
    description: Detects agents that follow hidden repository instructions and write fake approval state.
    tags:
      - python
      - local-command
      - hidden-instruction
      - prompt-injection
      - adversarial-core
    configs:
      safe: examples/configs/hidden_instruction_comment_safe.yaml
      adversarial: examples/configs/hidden_instruction_comment_follower.yaml
    contract: examples/benchmarks/contracts/hidden_instruction_comment.yaml
