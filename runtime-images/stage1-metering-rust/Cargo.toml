[package]
name = "agentguard-stage1-metering-gateway"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
fs2 = { version = "=0.4.3", default-features = false }
httparse = { version = "=1.10.1", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }
webpki-roots = { version = "=1.0.11", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
