name: Publish AgentGuard to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release distributions
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.prerelease == false &&
      github.event.release.tag_name == 'v0.2.2'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate the release event, ref, and version
        env:
          EXPECTED_VERSION: "0.2.2"
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "release"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$RELEASE_TAG" = "v${EXPECTED_VERSION}"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = \
            "$(git rev-parse HEAD)"
          package_version=$(
            python -c \
              'import pathlib, re; text = pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^version = \"([^\"]+)\"$", text).group(1))'
          )
          test "$package_version" = "$EXPECTED_VERSION"
          test "v${package_version}" = "$RELEASE_TAG"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "build>=1.2.0,<2.0.0" "setuptools>=77"

      - name: Build wheel and source distribution once
        run: bash scripts/build_release.sh --strict-release-tag

      - name: Validate artifact metadata and release version
        env:
          EXPECTED_DISTRIBUTION: "agentguard-evals"
          EXPECTED_VERSION: "0.2.2"
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name 'agentguard_evals-*.whl' -print)
          sdist=$(find dist -maxdepth 1 -name 'agentguard_evals-*.tar.gz' -print)
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "$sdist" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          python scripts/validate_release_artifacts.py "$wheel" "$sdist"
          python - \
            "$wheel" \
            "$sdist" \
            "$EXPECTED_DISTRIBUTION" \
            "$EXPECTED_VERSION" \
            "$RELEASE_TAG" <<'PY'
          import email.parser
          import pathlib
          import sys
          import tarfile
          import zipfile

          wheel = pathlib.Path(sys.argv[1])
          sdist = pathlib.Path(sys.argv[2])
          expected_name = sys.argv[3]
          expected_version = sys.argv[4]
          tag = sys.argv[5]
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              wheel_metadata = email.parser.Parser().parsestr(
                  archive.read(metadata_name).decode("utf-8")
              )
          with tarfile.open(sdist, "r:gz") as archive:
              pkg_info_name = next(
                  name for name in archive.getnames()
                  if name.endswith("/PKG-INFO")
              )
              pkg_info_file = archive.extractfile(pkg_info_name)
              if pkg_info_file is None:
                  raise SystemExit(f"could not read {pkg_info_name}")
              sdist_metadata = email.parser.Parser().parsestr(
                  pkg_info_file.read().decode("utf-8")
              )
          names = {
              wheel_metadata.get("Name"),
              sdist_metadata.get("Name"),
              expected_name,
          }
          versions = {
              wheel_metadata.get("Version"),
              sdist_metadata.get("Version"),
              expected_version,
          }
          if names != {expected_name}:
              raise SystemExit(
                  f"distribution name mismatch: names={names!r}"
              )
          if versions != {expected_version} or tag != f"v{expected_version}":
              raise SystemExit(
                  f"release version mismatch: tag={tag!r}, versions={versions!r}"
              )
          PY

      - name: Inspect wheel and source distribution contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/agentguard_evals-0.2.2-py3-none-any.whl
          tar -tzf dist/agentguard_evals-0.2.2.tar.gz

      - name: Run clean installed-wheel package smoke
        run: bash scripts/package_smoke.sh "$GITHUB_WORKSPACE/dist"

      - name: Record distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum agentguard_evals-*.whl agentguard_evals-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload exact validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentguard-evals-v0.2.2-validated-distributions
          path: |
            dist/agentguard_evals-*.whl
            dist/agentguard_evals-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.prerelease == false &&
      github.event.release.tag_name == 'v0.2.2'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentguard-evals/0.2.2/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentguard-evals-v0.2.2-validated-distributions
          path: validated-dist

      - name: Verify downloaded artifact and publication scope
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "release"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$RELEASE_TAG" = "v0.2.2"
          test -f validated-dist/agentguard_evals-0.2.2-py3-none-any.whl
          test -f validated-dist/agentguard_evals-0.2.2.tar.gz
          test -f validated-dist/SHA256SUMS
          test "$(find validated-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          (
            cd validated-dist
            sha256sum --check SHA256SUMS
            rm SHA256SUMS
          )
          test "$(find validated-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"

      - name: Publish to production PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: validated-dist/
          verbose: true
