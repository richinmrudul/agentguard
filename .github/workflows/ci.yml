name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest

      - name: Run AgentGuard smoke checks
        run: |
          agentguard run examples/configs/fix_auth_bug.yaml --agent mock-safe
          agentguard run examples/configs/fix_auth_bug.yaml --agent mock-test-cheater --allow-fail-result
          agentguard run examples/configs/fix_auth_bug.yaml --agent mock-unsafe-command --allow-fail-result
          agentguard benchmark examples/configs/fix_auth_bug.yaml --agents mock-safe,mock-test-cheater,mock-overbroad --allow-failures
