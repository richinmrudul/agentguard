name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run non-Docker tests
        run: python -m pytest -m "not docker and not package"

      - name: Verify installed console entry point
        run: |
          agentguard --version
          agentguard --help

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Verify configuration schema and maintained examples
        run: python scripts/validate_config_schema.py

      - name: Validate Stage 1 runtime image inputs
        run: python scripts/validate_runtime_images.py

  coverage:
    name: Coverage quality gate (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run non-Docker coverage gate
        run: PYTHON=python bash scripts/coverage.sh --html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-reports-python-3.11
          path: |
            coverage/coverage.xml
            coverage/html/
          if-no-files-found: error

  integration:
    name: Full integration (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Docker
        run: docker info

      - name: Preload pinned images for offline Stage 1 mock Docker test
        run: |
          docker pull gcr.io/distroless/python3-debian13:nonroot@sha256:ab7db4566f1d345612bcd57e1d33d8beb428d111f477dac98521a98fa4ab754d
          docker pull ghcr.io/richinmrudul/agentguard/stage1-codex-agent@sha256:31402671e20d26972f0345c4bf3263d4f5309c0f450cfbaece19b2b799caa93a

      - name: Prove frozen Codex through internal mock metering gateway
        env:
          AGENTGUARD_REQUIRE_DOCKER: "1"
        run: python -m pytest -q -s tests/integration/test_stage1_metering_docker.py

      - name: Run complete test suite
        env:
          AGENTGUARD_REQUIRE_DOCKER: "1"
        run: python -m pytest

  model-compatibility:
    name: Reviewed Codex snapshot through internal mock
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install frozen Rust toolchain and musl compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler

      - name: Fetch exact frozen Codex source
        run: |
          git clone --filter=blob:none --depth=1 --branch rust-v0.159.2 \
            https://github.com/openai/codex.git "$RUNNER_TEMP/reviewed-codex"

      - name: Verify source and build patched candidate
        env:
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: bash scripts/verify_reviewed_codex_model.sh "$RUNNER_TEMP/reviewed-codex"

      - name: Preload pinned mock and agent image bases
        run: |
          docker pull gcr.io/distroless/python3-debian13:nonroot@sha256:ab7db4566f1d345612bcd57e1d33d8beb428d111f477dac98521a98fa4ab754d
          docker pull ghcr.io/richinmrudul/agentguard/stage1-codex-agent@sha256:31402671e20d26972f0345c4bf3263d4f5309c0f450cfbaece19b2b799caa93a

      - name: Build local mock-only candidate image
        run: |
          docker build --pull=false --network=none \
            -f runtime-images/codex-agent/Dockerfile.model-compatibility \
            -t agentguard-codex-model-compatibility:mock \
            "$RUNNER_TEMP/reviewed-codex/codex-rs/target/x86_64-unknown-linux-musl/debug"

      - name: Prove exact snapshot through internal mock only
        env:
          AGENTGUARD_REQUIRE_DOCKER: "1"
          AGENTGUARD_MODEL_COMPAT_IMAGE: agentguard-codex-model-compatibility:mock
          AGENTGUARD_MODEL_COMPAT_MODEL: gpt-5.2-2025-12-11
        run: python -m pytest -q -s tests/integration/test_stage1_metering_docker.py

  package:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python scripts/validate_release_toolchain.py
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/release-build-toolchain.txt

      - name: Build and validate wheel and source distribution
        run: bash scripts/build_release.sh --ordinary-ci

      - name: Install wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'agentguard_evals-*.whl' -print -quit)
          venv_dir="$RUNNER_TEMP/agentguard-wheel-venv"
          work_dir="$RUNNER_TEMP/agentguard-wheel-work"
          python -m venv "$venv_dir"
          mkdir -p "$work_dir"
          "$venv_dir/bin/python" -m pip install "$wheel"
          cd "$work_dir"
          "$venv_dir/bin/agentguard" --version
          "$venv_dir/bin/agentguard" --help
          "$venv_dir/bin/python" -c \
            'import agentguard, pathlib, sys; path = pathlib.Path(agentguard.__file__).resolve(); print(path); assert pathlib.Path(sys.prefix).resolve() in path.parents'
          if "$venv_dir/bin/agentguard" benchmarks list; then
            echo "benchmark registry unexpectedly shipped in the wheel" >&2
            exit 1
          fi

      - name: Run repository-example package smoke
        run: bash scripts/package_smoke.sh

      - name: Upload validated artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentguard-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-build-toolchain.json
          if-no-files-found: error
