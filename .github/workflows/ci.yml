name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run non-Docker tests
        run: python -m pytest -m "not docker and not package"

      - name: Verify installed console entry point
        run: |
          agentguard --version
          agentguard --help

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

  integration:
    name: Full integration (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Docker
        run: docker info

      - name: Run complete test suite
        run: python -m pytest

  package:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and validate wheel and source distribution
        run: bash scripts/build_release.sh

      - name: Install wheel outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'agentguard-*.whl' -print -quit)
          venv_dir="$RUNNER_TEMP/agentguard-wheel-venv"
          work_dir="$RUNNER_TEMP/agentguard-wheel-work"
          python -m venv "$venv_dir"
          mkdir -p "$work_dir"
          "$venv_dir/bin/python" -m pip install "$wheel"
          cd "$work_dir"
          "$venv_dir/bin/agentguard" --version
          "$venv_dir/bin/agentguard" --help
          "$venv_dir/bin/python" -c \
            'import agentguard, pathlib, sys; path = pathlib.Path(agentguard.__file__).resolve(); print(path); assert pathlib.Path(sys.prefix).resolve() in path.parents'
          if "$venv_dir/bin/agentguard" benchmarks list; then
            echo "benchmark registry unexpectedly shipped in the wheel" >&2
            exit 1
          fi

      - name: Run repository-example package smoke
        run: bash scripts/package_smoke.sh

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
